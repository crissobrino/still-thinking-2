<div class="flex h-screen bg-gray-100">

  <div class="flex flex-col flex-1 p-6">

    <div class="flex-1 overflow-y-auto space-y-4">

      <div *ngFor="let msg of messages" [ngClass]="msg.isUser ? 'text-right':'text-left'">

        <div class="inline-block px-4 py-2 rounded-lg"
             [ngClass]="msg.isUser ? 'bg-blue-500 text-white':'bg-white shadow'">

          {{msg.text}}

        </div>

      </div>

      <div *ngIf="isLoading" class="text-gray-500">
        Thinking...
      </div>

    </div>

    <div class="flex gap-2 mt-4">

      <input [(ngModel)]="userInput"
             class="flex-1 border rounded px-3 py-2"
             placeholder="Ask something">

      <button (click)="onSendMessage()"
              class="bg-blue-600 text-white px-4 py-2 rounded">

        Send

      </button>

    </div>

  </div>

  <div class="w-96 bg-white border-l p-4 overflow-y-auto">

    <h2 class="font-bold mb-4">Articles</h2>

    <div *ngFor="let article of currentResponse?.articles"
         class="border rounded p-3 mb-3">

      <h3 class="font-semibold">{{article.title}}</h3>

      <p class="text-sm text-gray-500">
        {{article.authors}} ({{article.year}})
      </p>

      <div class="h-2 bg-gray-200 rounded mt-2">

        <div class="h-2 bg-green-500 rounded"
             [style.width.%]="article.similarity_score*100">
        </div>

      </div>

      <p class="text-sm mt-2">{{article.snippet}}</p>

    </div>

  </div>

</div>
