<div class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-indigo-50 via-white to-purple-50 dark:from-slate-950 dark:via-slate-900 dark:to-indigo-950 transition-colors duration-500">
  
  <button (click)="theme.toggleDarkMode()" class="absolute top-6 right-6 p-3 rounded-2xl bg-white/80 dark:bg-slate-800 shadow-xl border border-white dark:border-slate-700 hover:scale-110 transition-all flex items-center justify-center">
    @if (theme.darkMode()) {
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-amber-400">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M3 12h2.25m.386-6.364 1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M12 7.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z" />
      </svg>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-slate-700">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
      </svg>
    }
  </button>

  <div class="text-center p-10 backdrop-blur-md bg-white/40 dark:bg-slate-900/40 rounded-[40px] border border-white/50 dark:border-slate-700 shadow-2xl max-w-md w-full animate-fade-in">
    
    <div class="mb-8 flex justify-center animate-bounce-slow">
      <div class="p-6 rounded-3xl bg-indigo-600 shadow-2xl shadow-indigo-500/40">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
        </svg>
      </div>
    </div>

    <h1 class="text-4xl font-black text-slate-900 dark:text-slate-50 mb-3">
      {{ lang.translate('title') }}
    </h1>
    <p class="text-slate-600 dark:text-slate-300 mb-10 font-medium">
      {{ lang.translate('subtitle') }}
    </p>

    <div class="flex flex-col gap-4">
      <button (click)="start()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold shadow-lg shadow-indigo-300 dark:shadow-none transform hover:-translate-y-1 transition-all flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.59 14.37a7.228 7.228 0 0 1 3.458-1.407m2.035-2.097a1.2 1.2 0 0 0-1.812-1.51l-1.263 1.06a12.054 12.054 0 0 0-2.473 2.472l-1.06 1.263a1.2 1.2 0 0 0 1.51 1.812l1.263-1.06a12.054 12.054 0 0 0 2.472-2.473L21.1 10.87ZM10.757 14.917a1.2 1.2 0 0 0-1.812 1.51l1.263 1.06a12.054 12.054 0 0 0 2.472 2.473l1.06-1.263a1.2 1.2 0 0 0-1.51-1.812l-1.263 1.06a12.054 12.054 0 0 0-2.473-2.472l1.06-1.263ZM4.5 19.5 3 21l1.5-1.5Zm4.5-4.5L3 21l1.5-1.5L9 15Zm0 0-1.5 1.5L9 15Z" />
        </svg>
        {{ lang.translate('startBtn') }}
      </button>

      <div class="flex gap-2">
        @for (l of languages; track l) {
          <button (click)="lang.setLanguage(l)" 
            [class.bg-indigo-600]="lang.currentLang() === l"
            [class.text-white]="lang.currentLang() === l"
            [class.dark:bg-indigo-500]="lang.currentLang() === l"
            class="flex-1 py-2 text-xs font-bold border border-slate-200 dark:border-slate-700 dark:text-slate-200 rounded-xl hover:bg-gray-50 dark:hover:bg-slate-800 uppercase transition-all">
            {{ l }}
          </button>
        }
      </div>
    </div>
  </div>
</div>
